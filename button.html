<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons</title>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-regular-straight/css/uicons-regular-straight.css'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-link">
    <a href="index.html" class="pages-links">Home Page</a>
    <a href="button.html" class="pages-links">Button Page</a>
    
</div>
<div class="container">

    <div class="buttons">
        <button class="simple">Enroll Now
          <i class="fa-solid fa-up-right-and-down-left-from-center"></i>

        </button>
        <button class="dotted"> Explore Courses
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>
        <button class="square">
            <i class="fa-solid fa-code"></i>
            Front-end
        </button>    
     </div>
    <button class="stylish">Submit
    </button>
    
    <div class="radio-btn">
        <input type="radio" id="on-btn" name="status" value="on" checked>
        <label for="on-btn">On</label>
        <input type="radio" id="off-btn" name="status" value="off">
        <label for="off-btn">Off</label>
    </div>
    <button class="download">Download
        <i class="fa-solid fa-cloud-arrow-down"></i>
    </button>
    
    <button class="circle"> Sale! 50% 
       <br>
       Off
    </button>
</div>
<div class="container">
    <button class="setting">Settings
         <i class="fa-solid fa-gears"></i>
    </button>
    <button class="dashed">READ MORE
    </button>
    <button class="delete"><i class="fa-solid fa-trash"></i>
        Delete
    </button>
    <button class="account-btn"><i class="fa-solid fa-house"></i>
        Account
    </button>
    <button class="shop">Shop Now
        <i class="fi fi-rs-shopping-cart"></i>
    </button>
    <button class="power">
        <img src="images/power-on.png" alt="power">
    </button>
</div>
<div class="container">
    <button class="insta">
        <img src="images/instagram.png" alt="instagram">
         @your username
    </button>
    <button class="play-btn">
        <i class="fa-solid fa-play"></i>
    </button>
    <button class="google">
            <img src="images/playstore.png" alt="googleplay">
            
            <div class="playstore">
                <span class="small-text">GET IT ON</span>
                <span class="large-text">Google Play</span>
            </button>
</div>

</body>
</html>
